name: Setup
description: Setup project

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

    - name: Setup Node.js
      uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
      with:
        node-version-file: .node-version
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Copy .env
      shell: bash
      run: cp apps/web/.env apps/web/.env.local

    - name: Copy wrangler.json
      shell: bash
      run: |
        cp apps/cdn/wrangler.example.json apps/cdn/wrangler.json
        cp apps/overlay/wrangler.example.json apps/overlay/wrangler.json
        cp apps/web/wrangler.example.json apps/web/wrangler.json
