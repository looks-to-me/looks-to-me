name: Setup
description: Setup project

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

    - name: Setup Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version-file: .node-version
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Copy .env
      shell: bash
      run: cp apps/web/.env apps/web/.env.local

    - name: Copy wrangler.json
      shell: bash
      run: |
        cp apps/cdn/wrangler.example.json apps/cdn/wrangler.json
        cp apps/overlay/wrangler.example.json apps/overlay/wrangler.json
        cp apps/web/wrangler.example.json apps/web/wrangler.json
